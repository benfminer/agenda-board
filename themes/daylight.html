<!doctype html>
<html lang="en" data-board-theme="daylight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda Board: Daylight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="daylight.css?v=20261102k">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
  </div>

  <div id="board">
    <header class="top">
      <svg class="arc" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path id="arc-full" class="arc-full" />
        <path id="arc-done" class="arc-done" />
      </svg>
      <div id="sun" class="sun"></div>
      <div class="date">
        <div id="weekday" class="weekday"></div>
        <div id="fulldate" class="fulldate"></div>
      </div>
      <div class="center">
        <div id="clock" class="clock"></div>
        <div id="day-note" class="day-note"></div>
      </div>
      <div id="weather" class="weather">
        <div class="weather-icon" id="w-icon"></div>
        <div class="weather-temp" id="w-temp">--°</div>
        <div class="weather-desc" id="w-desc">Loading weather</div>
      </div>
    </header>

    <div id="announcement" class="announcement hidden" role="status"></div>

    <main class="middle">
      <section class="card agenda">
        <h2>Today's Agenda</h2>
        <div class="fit" id="agenda-fit"><ol id="agenda-list" class="agenda-list"></ol></div>
      </section>
      <div class="side">
        <section class="card notes">
          <h2>Notes</h2>
          <div class="fit" id="notes-fit"><ul id="notes-list" class="notes-list"></ul></div>
        </section>
        <section class="card events">
          <h2>Coming Up</h2>
          <div class="fit" id="events-fit"><ul id="events-list" class="events-list"></ul></div>
        </section>
      </div>
    </main>

    <section class="bottom">
      <div class="card forecast">
        <h2>5-Day Forecast</h2>
        <div id="forecast" class="forecast-days"></div>
      </div>
      <div class="card quote">
        <h2>Quote of the Day</h2>
        <div id="quote-text" class="quote-text"></div>
        <div id="quote-author" class="quote-author"></div>
        <div id="music-now" class="music-now hidden"></div>
      </div>
    </section>

    <footer id="news" class="card news hidden">
      <div class="news-label">In the News</div>
      <div id="news-text" class="news-text">
        <div class="news-top">
          <div id="news-headline" class="news-headline"></div>
          <div id="news-source" class="news-source"></div>
        </div>
        <div id="news-summary" class="news-summary"></div>
      </div>
    </footer>
  </div>

  <div id="banner" class="banner hidden">
    <div class="banner-title">Independent Work Time</div>
    <div id="banner-sub" class="banner-sub"></div>
  </div>
  <div id="sound-prompt" class="sound-prompt hidden">Press OK on the remote for full screen and the bell sound</div>
  <div id="status" class="status"></div>

  <script src="../config.js?v=20261102k"></script>
  <script src="../quotes.js?v=20261102k"></script>
  <script src="../sample-data.js?v=20261102k"></script>
  <script src="../app.js?v=20261102k"></script>
  <script src="../music.js?v=20261102k"></script>
  <script src="daylight.js?v=20261102k"></script>
</body>
</html>
